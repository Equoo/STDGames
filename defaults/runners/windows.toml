# Runner defaults for target = { kind = "windows" }. A game only needs to
# declare `[modes.<name>] enabled = true` to pick up these layers; it writes
# its own `layers = [...]` only to override a specific slot (e.g. pin a
# different Proton version/build, or a different Sandbox profile) — note
# that an override replaces the *whole* layer for that slot, params
# included, not just the params it actually wants to change.
#
# Paths below are this deployment's real, already-installed resources (see
# /sgoinfre/stdgames/.resources) — not something this workspace discovers on
# its own; a different deployment's global.toml/runners/*.toml would point
# these elsewhere.
#
# The Sandbox slot itself isn't listed here: every mode already gets the
# baseline Conty layer from defaults/global.toml. "super-compat" below is
# the one mode that asks for something different (a stricter Conty sandbox
# level), so it's the one that overrides it.

# Adds the Steam Linux Runtime (pressure-vessel) on top of "desktop", for
# games that need scout/soldier-era compatibility libraries alongside Proton.
[modes.steam]
layers = [
	{ id = "proton", params = { version = "GE-Proton11-6", proton_path = "/home/equo/.local/share/Steam/compatibilitytools.d/GE-Proton11-6-x86_64/", prefix_path = "/tmp/feur", steam_client_path = "/home/equo/.local/share/Steam" } },
]

# Emulates the Steam API instead of talking to a real Steam client: the
# SteamApi slot's PlainReplace variant bind-mounts `replacement_lib_path`
# (an already-built emulator, e.g. Goldberg SteamEmu — this layer never
# builds or downloads one) directly over the game's own steam_api64.dll, at
# the same on-disk path Wine loads it from. Set `target_lib_relpath` too if
# a game's own copy isn't named "steam_api64.dll" (the PlainReplace
# default; see stdg-cli/src/registry.rs).
[modes.steamemu]
layers = [
	{ id = "steamapi-emu", params = { replacement_lib_path = "/home/equo/Documents/STDGames/steamemu/x64/steam_api64.dll" } },
	{ id = "proton", params = { version = "GE-Proton11-6", proton_path = "/home/equo/.local/share/Steam/compatibilitytools.d/GE-Proton11-6-x86_64/", prefix_path = "/tmp/feur", steam_client_path = "/home/equo/.local/share/Steam" } },
]
