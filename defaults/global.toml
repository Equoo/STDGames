# Global defaults: the lowest-precedence tier of the per-slot layer merge
# (see docs on stdg_plan::cascade::GlobalDefaults). Applied to every mode of
# every game, before runner- and game-specific layers override individual
# slots.
#
# The Sandbox slot is mandatory (stdg_plan::validate::MANDATORY_SLOTS) —
# there is no unsandboxed launch mode — so every deployment's global.toml is
# expected to carry one. It's filled by Conty (github.com/Kron4ek/Conty), a
# single-file container runtime that brings its own userspace; a game or
# runner can override the slot to pass `sandbox_level` (Conty's SANDBOX_LEVEL,
# 1-3) for locked-down sessions. `conty_path` is this deployment's real,
# already-installed Conty build — a different deployment points it elsewhere.
#
# Supervision is a good fit here too: nothing about a dedicated cgroup
# session depends on the target kind, so every launch gets one unless a
# game explicitly overrides the Supervision slot itself.
baseline_layers = [
	{ id = "conty", params = { conty_path = "/home/equo/Documents/STDGames/conty.sh" } },
	{ id = "cgroup" },
]
