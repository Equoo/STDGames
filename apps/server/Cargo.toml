[package]
name = "stdgames-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
reqwest = { version = "0.12.24", features = ["json"] }
rusty_ytdl = "0.7.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

[[bin]]
name = "server"
path = "src/main.rs"
